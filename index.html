<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="東京都の町丁目ごとに人口増減・犯罪発生率・施設の近さを重ねて見る地図" />
    <meta name="theme-color" content="#2b8cbe" />
    <!-- PWA: ホーム画面に追加すると全画面で起動する -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="住環境マップ" />
    <title>東京の住環境マップ</title>
  </head>
  <body>
    <div id="map"></div>
    <aside id="panel">
      <!-- スマホでは下部シート。見出しをタップで広げる / 畳む -->
      <button id="sheet-toggle" type="button" aria-expanded="false" aria-controls="panel-body">
        <h1>東京の住環境マップ</h1>
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <div id="panel-body">
      <p class="note">町丁目ごとの人口増減・犯罪発生率・施設の近さを重ねて見る地図。町丁目をタップすると数値が出ます。</p>

      <section>
        <h2>表示する軸</h2>
        <label><input type="radio" name="axis" value="rate" checked /> 人口増減（2015 → 2020）</label>
        <label><input type="radio" name="axis" value="crime" /> 犯罪発生率（2025、人口千人あたり）</label>
        <label><input type="radio" name="axis" value="access" /> 施設の近さ（1 km 以内の充実度）</label>
        <label><input type="radio" name="axis" value="score" /> 総合スコア（3 軸の重み付き平均）</label>
      </section>

      <section id="weights">
        <h2>総合スコアの重み</h2>
        <p class="note">各軸を百分位（0〜100）にして重み付き平均します。犯罪は少ないほど高くなります。</p>
        <label>人口増減 <input type="range" name="weight" data-axis="rate" min="0" max="10" value="5" /><output>5</output></label>
        <label>治安 <input type="range" name="weight" data-axis="crime_per_1000" min="0" max="10" value="5" /><output>5</output></label>
        <label>施設の近さ <input type="range" name="weight" data-axis="access_score" min="0" max="10" value="5" /><output>5</output></label>
      </section>

      <section>
        <h2>凡例</h2>
        <p id="legend-title" class="note"></p>
        <ul id="legend" class="legend"></ul>
      </section>

      <section>
        <h2>背景</h2>
        <label><input type="radio" name="basemap" value="pale" checked /> 淡色地図</label>
        <label><input type="radio" name="basemap" value="photo" /> 航空写真</label>
      </section>

      <section>
        <h2>施設</h2>
        <label><input type="checkbox" id="places-toggle" checked /> 施設を表示</label>
        <p id="places-hint" class="note" hidden>ズーム 13 以上で表示されます</p>
        <ul id="places-legend" class="legend"></ul>
      </section>
      </div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
